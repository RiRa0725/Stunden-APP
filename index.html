<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#111827">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="apple-mobile-web-app-title" content="ZeitPol">

  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="styles.css">

  <title>ZeitPol</title>
</head>

<body>

  <main class="app-shell">

    <header class="topbar">

      <div>
        <p class="eyebrow">Zeiterfassung</p>
        <h1>ZeitPol</h1>
      </div>

      <button
        class="icon-button"
        type="button"
        aria-label="Einstellungen"
      >
        ⚙️
      </button>

    </header>

    <section
      id="recordingSection"
      class="card timer-card"
    >

      <p class="section-label">
        Stunden erfassen
      </p>

      <label for="hours">
        Stunden
      </label>

      <input
        id="hours"
        type="text"
        inputmode="decimal"
        placeholder="z. B. 7,5"
        autocomplete="off"
      >

      <label for="commission">
        Kommission
      </label>

      <select id="commission">

        <option value="Kommission 001">
          Kommission 001
        </option>

        <option value="Kommission 002">
          Kommission 002
        </option>

        <option value="Kommission 003">
          Kommission 003
        </option>

      </select>

      <label for="activity">
        Tätigkeit
      </label>

      <input
        id="activity"
        type="text"
        placeholder="z. B. Besprechung"
        autocomplete="off"
      >

      <button
        id="addEntry"
        class="primary-button"
        type="button"
      >
        Stunden erfassen
      </button>

    </section>

    <section
      id="todaySection"
      class="card"
    >

      <div class="section-heading">

        <div>

          <p class="section-label">
            Heute
          </p>

          <h2>
            Zeiteinträge
          </h2>

          <div id="totalHours">
            0 Stunden
          </div>

        </div>

        <span
          id="entryCount"
          class="badge"
        >
          0 Einträge
        </span>

      </div>

      <div
        id="entries"
        class="empty-state"
      >
        Noch keine Einträge vorhanden.
      </div>

    </section>

    <section
      id="evaluationSection"
      class="card"
      style="display: none;"
    >

      <p class="section-label">
        Auswertung
      </p>

      <h2>
        Übersicht
      </h2>

      <div class="entry">
        <div>
          <strong>Heute</strong>
          <div id="evaluationToday">
            0 Stunden
          </div>
        </div>
      </div>

      <div class="entry">
        <div>
          <strong>Diese Woche</strong>
          <div id="evaluationWeek">
            0 Stunden
          </div>
        </div>
      </div>

      <div class="entry">
        <div>
          <strong>Diesen Monat</strong>
          <div id="evaluationMonth">
            0 Stunden
          </div>
        </div>
      </div>

      <p class="section-label">
        Nach Kommission
      </p>

      <div id="evaluationCommissions">
        Noch keine Einträge vorhanden.
      </div>

    </section>

    <nav
      class="bottom-nav"
      aria-label="Hauptnavigation"
    >

      <button
        id="navRecording"
        class="nav-item active"
        type="button"
      >
        ⏱️
        <span>Erfassung</span>
      </button>

      <button
        id="navEvaluation"
        class="nav-item"
        type="button"
      >
        📊
        <span>Auswertung</span>
      </button>

      <button
        class="nav-item"
        type="button"
      >
        🏛️
        <span>Kommissionen</span>
      </button>

    </nav>

  </main>

  <script src="app.js"></script>

</body>
</html>
