<!doctype html>

<html lang="de"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <meta name="theme-color" content="#111827"> <meta name="apple-mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <meta name="apple-mobile-web-app-title" content="ZeitPol"> <link rel="manifest" href="manifest.json"> <link rel="apple-touch-icon" href="icons/icon-180.png"> <link rel="stylesheet" href="styles.css"> <title>ZeitPol</title> </head> <body> <main class="app-shell"> <header class="topbar"> <div> <p class="eyebrow">Zeiterfassung</p> <h1>ZeitPol</h1> </div> <button class="icon-button" aria-label="Einstellungen">⚙️</button> </header>

<section class="card timer-card" aria-labelledby="timer-title">
  <p id="timer-title" class="section-label">Stunden erfassen</p>

  <label>
    Stunden
    <input
      id="hours"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.25"
      placeholder="z. B. 7,5"
    >
  </label>

  <label>
    Kommission
    <select id="commission">
      <option>Kommission 001</option>
      <option>Kommission 002</option>
      <option>Kommission 003</option>
    </select>
  </label>

  <label>
    Tätigkeit
    <input id="activity" type="text" placeholder="z. B. Besprechung">
  </label>

  <button id="addEntry" class="primary-button">Stunden erfassen</button>
</section>

<section class="card">
  <div class="section-heading">
    <div>
      <p class="section-label">Heute</p>
      <h2>Zeiteinträge</h2>
    </div>
    <span id="entryCount" class="badge">0 Einträge</span>
  </div>
<div id="totalHours">0 Stunden</div>
  <div id="entries" class="empty-state">
    Noch keine Einträge vorhanden.
  </div>
</section>

<nav class="bottom-nav" aria-label="Hauptnavigation">
  <button class="nav-item active">⏱️<span>Erfassung</span></button>
  <button class="nav-item">📊<span>Auswertung</span></button>
  <button class="nav-item">🏛️<span>Kommissionen</span></button>
</nav>

</main>

<script src="app.js"></script>

</body> </html>
