<header class="topbar">
  <div>
    <p class="eyebrow">Zeiterfassung</p>
    <h1>ZeitPol</h1>
  </div>

  <button
    class="icon-button"
    type="button"
    aria-label="Einstellungen"
  >
    ⚙️
  </button>
</header>

<section class="card timer-card">

  <p class="section-label">
    Stunden erfassen
  </p>

  <label for="hours">
    Stunden
  </label>

  <input
    id="hours"
    type="text"
    inputmode="decimal"
    placeholder="z. B. 7,5"
    autocomplete="off"
  >

  <label for="commission">
    Kommission
  </label>

  <select id="commission">

    <option value="Kommission 001">
      Kommission 001
    </option>

    <option value="Kommission 002">
      Kommission 002
    </option>

    <option value="Kommission 003">
      Kommission 003
    </option>

  </select>

  <label for="activity">
    Tätigkeit
  </label>

  <input
    id="activity"
    type="text"
    placeholder="z. B. Besprechung"
    autocomplete="off"
  >

  <button
    id="addEntry"
    class="primary-button"
    type="button"
  >
    Stunden erfassen
  </button>

</section>

<section class="card">

  <div class="section-heading">

    <div>

      <p class="section-label">
        Heute
      </p>

      <h2>
        Zeiteinträge
      </h2>

      <div id="totalHours">
        0 Stunden
      </div>

    </div>

    <span
      id="entryCount"
      class="badge"
    >
      0 Einträge
    </span>

  </div>

  <div
    id="entries"
    class="empty-state"
  >
    Noch keine Einträge vorhanden.
  </div>

</section>

<nav
  class="bottom-nav"
  aria-label="Hauptnavigation"
>

  <button
    class="nav-item active"
    type="button"
  >
    ⏱️
    <span>
      Erfassung
    </span>
  </button>

  <button
    class="nav-item"
    type="button"
  >
    📊
    <span>
      Auswertung
    </span>
  </button>

  <button
    class="nav-item"
    type="button"
  >
    🏛️
    <span>
      Kommissionen
    </span>
  </button>

</nav>
</main> <script src="app.js"></script> </body> </html>
